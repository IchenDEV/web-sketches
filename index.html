<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="小场景、小页面与交互实验。每一次灵感，都有一个可以打开的地方。">
  <title>小景 · Web Sketches</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #343d36; background: #f5f3ec; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1180px; margin: auto; padding: 76px 36px 40px; }
    header { margin-bottom: 48px; }
    .eyebrow { font-size: 11px; letter-spacing: 3px; color: #7a8278; }
    h1 { font: 400 48px "Songti SC", "Noto Serif CJK SC", serif; letter-spacing: 8px; margin: 18px 0; }
    header p { font-size: 14px; line-height: 1.8; color: #697368; }
    article { border-top: 1px solid #d9dcd0; padding-top: 22px; }
    .entry { display: block; color: inherit; text-decoration: none; }
    figure { margin: 0; overflow: hidden; background: #eeeede; }
    img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 1; }
    .caption { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0 30px; }
    h2 { font: 400 24px "Songti SC", "Noto Serif CJK SC", serif; letter-spacing: 3px; margin: 0 0 9px; }
    .caption p { font-size: 13px; color: #697368; line-height: 1.8; margin: 0; }
    .open { flex-shrink: 0; font-size: 13px; border-bottom: 1px solid #a3ae9d; padding-bottom: 5px; }
    a:hover .open { border-color: #354b38; }
    a:focus-visible { outline: 2px solid #73886c; outline-offset: 7px; }
    .sights {display:flex;flex-wrap:wrap;gap:24px;padding:0 0 26px;font-size:12px;} .sights a {color:#566c53;text-underline-offset:5px;}
    footer { border-top: 1px solid #d9dcd0; display: flex; justify-content: space-between; gap: 20px; padding-top: 22px; color: #7a8278; font-size: 11px; }
    footer a { color: inherit; text-underline-offset: 4px; }
    @media (max-width: 600px) { main { padding: 44px 22px 28px; } h1 { font-size: 38px; } header { margin-bottom: 30px; } .caption { align-items: flex-start; gap: 14px; } .caption p { max-width: 230px; } footer { flex-wrap: wrap; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">WEB SKETCHES</div>
      <h1>小景</h1>
      <p>小场景、小页面与交互实验。<br>每一次灵感，都有一个可以打开的地方。</p>
    </header>
    <article>
      <a class="entry" href="./projects/west-lake/">
        <figure><img src="./previews/west-lake.png" width="2172" height="724" alt="柳树、亭桥、远山与三座石塔构成的西湖水墨湖景"></figure>
        <div class="caption">
          <div><h2>杭州小景</h2><p>三潭印月、雷峰夕照、断桥残雪、九溪烟树。四处可以环顾、暂停和留影的杭州山水。</p></div>
          <span class="open">进入画境 ↗</span>
        </div>
      </a>
      <nav class="sights" aria-label="杭州景点直达">
        <a href="./projects/west-lake/#leifeng">雷峰夕照 ↗</a>
        <a href="./projects/west-lake/#broken-bridge">断桥残雪 ↗</a>
        <a href="./projects/west-lake/#nine-creeks">九溪烟树 ↗</a>
      </nav>
    </article>
    <footer><span>独立作品，持续收录。</span><a href="https://github.com/IchenDEV/web-sketches">GitHub · 源码</a></footer>
  </main>
</body>
</html>
