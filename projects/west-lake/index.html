<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/seal.svg" />
    <title>杭州小景 · 湖山入画</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main id="scene" aria-label="可旋转的西湖三维山水场景"></main>
    <header>
      <div class="seal">西湖</div>
      <div>
        <h1>湖山入画</h1>
        <p>一湖烟水 · 半卷江南</p>
      </div>
    </header>
    <aside class="poem">水光潋滟晴方好<br />山色空蒙雨亦奇</aside>
    <footer>
      <div class="destinations">
        <button id="open-atlas" aria-haspopup="dialog">西湖三十景</button>
        <button id="previous-scene" aria-label="上一景">‹</button>
        <select id="destination" disabled aria-label="选择杭州景点"></select>
        <button id="next-scene" aria-label="下一景">›</button>
        <span id="scene-position" class="hint"></span>
      </div>
      <nav aria-label="场景控制">
        <button id="motion" aria-pressed="false" title="暂停水波与风">
          暂停光阴</button
        ><button id="reset" title="回到初始构图">归于画境</button
        ><button id="capture" title="保存当前画面">留一帧</button
        ><button id="fullscreen" title="全屏欣赏">全屏</button>
      </nav>
    </footer>
    <dialog id="atlas" aria-labelledby="atlas-title">
      <div class="atlas-heading">
        <div>
          <p>三代十景 · 一卷西湖</p>
          <h2 id="atlas-title">湖山，三十境</h2>
        </div>
        <button id="close-atlas" aria-label="关闭景目">关闭 ×</button>
      </div>
      <div id="atlas-collections"></div>
      <p class="atlas-note">选择一景，步入画中。拖动环顾，滚轮远近。</p>
    </dialog>
    <div id="loading" role="status">正在铺开湖山…</div>
    <div id="toast" role="status"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
